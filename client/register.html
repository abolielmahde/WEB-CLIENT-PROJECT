<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WEB CLIENT | Register</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<div class="container">
  <div class="grid">
    <div class="col-12 card pad">

      <h1>Register</h1>
      <p>Create a new user and save it in LocalStorage.</p>

      <div id="msg"></div>

      <form class="form" id="registerForm" novalidate>
        <div class="grid">

          <div class="col-6">
            <label>Username *</label>
            <input id="username" autocomplete="username" required />
          </div>

          <div class="col-6">
            <label>First Name *</label>
            <input id="firstName" required />
          </div>

          <div class="col-6">
            <label>Password *</label>
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              required
            />
            <div class="help">
              At least 6 characters, including at least one letter,
              one number, and one special character.
            </div>
          </div>

          <div class="col-6">
            <label>Confirm Password *</label>
            <input
              id="password2"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="col-12">
            <label>Image (URL)</label>
            <input id="imageUrl" placeholder="https://..." />
            <div class="help">
              If left empty, a default image will be used.
            </div>
          </div>

        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" type="submit">Create User</button>
          <a class="btn secondary" href="login.html">I already have an account</a>
        </div>

      </form>

    </div>
  </div>
</div>

<script src="js/config.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/register.js" defer></script>

</body>
</html>

<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WEB CLIENT | Login</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  
<div class="container">
  <div class="grid">
    <div class="col-12 card pad">
      <h1>התחברות</h1>
      <p>בדיקת שם משתמש וסיסמה מול המשתמשים ב-LocalStorage. בהצלחה נשמור currentUser ב-SessionStorage.</p>

      <div id="msg"></div>

      <form class="form" id="loginForm" novalidate>
        <div class="grid">
          <div class="col-6">
            <label>שם משתמש *</label>
            <input id="username" autocomplete="username" required />
          </div>
          <div class="col-6">
            <label>סיסמה *</label>
            <input id="password" type="password" autocomplete="current-password" required />
          </div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" type="submit">התחבר</button>
          <a class="btn secondary" href="register.html">אין לי משתמש</a>
        </div>
      </form>

      <div class="help" style="margin-top:14px;">
        אם הגעת לכאן כי ניסית לפתוח דף מוגן (חיפוש/פלייליסטים), אחרי ההתחברות תועבר אוטומטית לדף שביקשת.
      </div>
    </div>
  </div>
</div>

  
  <script src="js/config.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
